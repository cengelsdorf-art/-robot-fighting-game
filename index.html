<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Robot Fighters 3D</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101820;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:10px;
    left:0;
    width:100%;
    z-index:5;
    color:white;
    text-align:center;
    pointer-events:none;
}

#title{
    font-size:25px;
    font-weight:bold;
    text-shadow:0 2px 5px black;
}

#round{
    margin-top:4px;
    font-weight:bold;
}

.bar{
    position:absolute;
    top:48px;
    height:25px;
    width:35%;
    border:3px solid white;
    border-radius:8px;
    background:#222;
    overflow:hidden;
}

#playerBar{
    left:10px;
}

#enemyBar{
    right:10px;
}

.hp{
    width:100%;
    height:100%;
}

#playerHP{
    background:#16d66b;
}

#enemyHP{
    background:#e53935;
}


/* JOYSTICK */

#joystick{
    position:fixed;
    left:25px;
    bottom:25px;

    width:140px;
    height:140px;

    border-radius:50%;

    background:rgba(255,255,255,.15);
    border:3px solid rgba(255,255,255,.35);

    z-index:10;
}

#stick{
    position:absolute;

    width:64px;
    height:64px;

    left:38px;
    top:38px;

    border-radius:50%;

    background:rgba(255,255,255,.6);
}


/* BUTTONS */

.action{
    position:fixed;
    z-index:10;

    border:0;
    border-radius:50%;

    color:white;
    font-weight:bold;

    box-shadow:0 4px 10px #0008;

    touch-action:none;
}

#punch{
    right:135px;
    bottom:105px;

    width:82px;
    height:82px;

    background:#e53935;
}

#kick{
    right:30px;
    bottom:35px;

    width:90px;
    height:90px;

    background:#ff9800;
}

#block{
    right:130px;
    bottom:18px;

    width:72px;
    height:72px;

    background:#1976d2;
}


/* MITTEILUNG */

#message{
    display:none;

    position:fixed;
    inset:0;

    z-index:20;

    background:rgba(0,0,0,.75);

    color:white;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;
}

#message h1{
    font-size:42px;
    margin:10px;
}

#message button{
    padding:15px 30px;

    border:0;
    border-radius:10px;

    font-size:18px;
    font-weight:bold;
}

</style>
</head>

<body>


<div id="hud">

    <div id="title">
        ROBOT FIGHTERS
    </div>

    <div id="round">
        Runde 1
    </div>

    <div class="bar" id="playerBar">
        <div class="hp" id="playerHP"></div>
    </div>

    <div class="bar" id="enemyBar">
        <div class="hp" id="enemyHP"></div>
    </div>

</div>


<div id="joystick">

    <div id="stick"></div>

</div>


<button class="action" id="punch">
    PUNCH
</button>

<button class="action" id="kick">
    KICK
</button>

<button class="action" id="block">
    BLOCK
</button>


<div id="message">

    <h1 id="messageTitle">
        SIEG!
    </h1>

    <p id="messageText">
        Du hast gewonnen!
    </p>

    <button id="nextRound">
        NÄCHSTE RUNDE
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =====================================================
// SZENE
// =====================================================

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x101820);


const camera =
new THREE.PerspectiveCamera(
    60,
    innerWidth/innerHeight,
    .1,
    100
);

camera.position.set(
    0,
    7,
    11
);


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LICHT
// =====================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2
    )
);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    5,
    10,
    5
);

scene.add(sun);


// =====================================================
// ARENA
// =====================================================

const floor =
new THREE.Mesh(

    new THREE.BoxGeometry(
        18,
        .4,
        14
    ),

    new THREE.MeshStandardMaterial({
        color:0x303030
    })

);

floor.position.y=-.2;

scene.add(floor);


const ring =
new THREE.Mesh(

    new THREE.BoxGeometry(
        14,
        .08,
        10
    ),

    new THREE.MeshStandardMaterial({
        color:0x555555
    })

);

ring.position.y=.03;

scene.add(ring);


// Wände

function createWall(
    x,
    z,
    width,
    depth
){

    const wall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            1.5,
            depth
        ),

        new THREE.MeshStandardMaterial({
            color:0x111111
        })

    );

    wall.position.set(
        x,
        .75,
        z
    );

    scene.add(wall);
}

createWall(
    0,
    -6.5,
    18,
    .3
);

createWall(
    0,
    6.5,
    18,
    .3
);

createWall(
    -8.5,
    0,
    .3,
    13
);

createWall(
    8.5,
    0,
    .3,
    13
);


// =====================================================
// ROBOT
// =====================================================

function createRobot(color){

    const robot =
    new THREE.Group();


    const metal =
    new THREE.MeshStandardMaterial({

        color:color,

        metalness:.8,

        roughness:.25

    });


    const dark =
    new THREE.MeshStandardMaterial({

        color:0x222222,

        metalness:.8

    });


    // Körper

    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.35,
            1.7,
            .8
        ),

        metal

    );

    body.position.y=2.7;

    robot.add(body);


    // Kopf

    const head =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.15,
            .9,
            .9
        ),

        metal

    );

    head.position.y=4.05;

    robot.add(head);


    // Augen

    const eyes =
    new THREE.MeshBasicMaterial({
        color:0x00ffff
    });


    for(
        const x of [-.25,.25]
    ){

        const eye =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .22,
                .12,
                .05
            ),

            eyes

        );

        eye.position.set(
            x,
            4.08,
            -.48
        );

        robot.add(eye);

    }


    // Arme

    const armGeometry =
    new THREE.BoxGeometry(
        .45,
        1.5,
        .45
    );


    const leftArm =
    new THREE.Mesh(
        armGeometry,
        metal
    );


    const rightArm =
    new THREE.Mesh(
        armGeometry,
        metal
    );


    leftArm.position.set(
        -1,
        2.7,
        0
    );


    rightArm.position.set(
        1,
        2.7,
        0
    );


    robot.add(leftArm);
    robot.add(rightArm);


    // Hände

    const handGeometry =
    new THREE.BoxGeometry(
        .55,
        .45,
        .55
    );


    const leftHand =
    new THREE.Mesh(
        handGeometry,
        dark
    );


    const rightHand =
    new THREE.Mesh(
        handGeometry,
        dark
    );


    leftHand.position.set(
        -1,
        1.9,
        0
    );


    rightHand.position.set(
        1,
        1.9,
        0
    );


    robot.add(leftHand);
    robot.add(rightHand);


    // Beine

    const legGeometry =
    new THREE.BoxGeometry(
        .5,
        1.5,
        .55
    );


    const leftLeg =
    new THREE.Mesh(
        legGeometry,
        metal
    );


    const rightLeg =
    new THREE.Mesh(
        legGeometry,
        metal
    );


    leftLeg.position.set(
        -.4,
        1,
        0
    );


    rightLeg.position.set(
        .4,
        1,
        0
    );


    robot.add(leftLeg);
    robot.add(rightLeg);


    robot.userData.leftArm =
    leftArm;

    robot.userData.rightArm =
    rightArm;

    robot.userData.leftLeg =
    leftLeg;

    robot.userData.rightLeg =
    rightLeg;


    return robot;
}


// =====================================================
// SPIELER
// =====================================================

const player =
createRobot(0x1677ff);

player.position.set(
    -3,
    0,
    0
);

scene.add(player);


// =====================================================
// GEGNER
// =====================================================

let enemy =
createRobot(0xff3030);

enemy.position.set(
    3,
    0,
    0
);

scene.add(enemy);


// =====================================================
// RUNDEN-SYSTEM
// =====================================================

let round=1;


// Gegner wird mit jeder Runde stärker

let enemyMaxHP=100;

let enemyDamage=10;

let enemySpeed=1.4;

let enemyAttackCooldown=1.1;


// =====================================================
// SPIELER-WERTE
// =====================================================

let playerHP=100;

let playerAttack=0;

let enemyAttackTimer=0;

let blocking=false;

let gameOver=false;


// Joystick

let joystickX=0;

let joystickY=0;

let joystickPointer=null;


// =====================================================
// HP
// =====================================================

function updateHP(){

    document.getElementById(
        "playerHP"
    ).style.width =
        Math.max(
            0,
            playerHP
        )+"%";


    document.getElementById(
        "enemyHP"
    ).style.width =
        Math.max(
            0,
            enemyHP
        )+"%";

}


// =====================================================
// NEUEN GEGNER ERSTELLEN
// =====================================================

function createNextEnemy(){

    scene.remove(enemy);


    /*
       Jede Runde:

       +25 HP
       +3 Schaden
       +0.2 Geschwindigkeit
       -0.08 Sekunden Angriffspause
    */


    enemyMaxHP =
        100 + (round-1)*25;


    enemyDamage =
        10 + (round-1)*3;


    enemySpeed =
        1.4 + (round-1)*.2;


    enemyAttackCooldown =
        Math.max(
            .45,
            1.1 - (round-1)*.08
        );


    enemy =
    createRobot(0xff3030);


    enemy.position.set(
        3,
        0,
        0
    );


    scene.add(enemy);


    enemyHP =
        enemyMaxHP;


    playerHP=100;


    document.getElementById(
        "round"
    ).textContent =
        "Runde "+round;


    updateHP();

}


// =====================================================
// SPIELER BEWEGEN
// =====================================================

function movePlayer(delta){

    if(gameOver)return;


    const speed=4;


    player.position.x +=
        joystickX*
        speed*
        delta;


    player.position.z +=
        joystickY*
        speed*
        delta;


    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -6.5,
            6.5
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -4.5,
            4.5
        );

}


// =====================================================
// PUNCH
// =====================================================

function punch(){

    if(
        gameOver ||
        playerAttack>0
    )return;


    playerAttack=.35;


    const distance =
        player.position.distanceTo(
            enemy.position
        );


    if(distance<2.8){

        enemyHP-=12;

        updateHP();


        enemy.position.z+=.25;

    }

}


// =====================================================
// KICK
// =====================================================

function kick(){

    if(
        gameOver ||
        playerAttack>0
    )return;


    playerAttack=.55;


    const distance =
        player.position.distanceTo(
            enemy.position
        );


    if(distance<3){

        enemyHP-=18;

        updateHP();


        enemy.position.z+=.4;

    }

}


// =====================================================
// BUTTONS
// =====================================================

document.getElementById(
    "punch"
).addEventListener(
    "pointerdown",
    punch
);


document.getElementById(
    "kick"
).addEventListener(
    "pointerdown",
    kick
);


const blockButton =
document.getElementById(
    "block"
);


blockButton.addEventListener(
    "pointerdown",
    ()=>{
        blocking=true;
    }
);


blockButton.addEventListener(
    "pointerup",
    ()=>{
        blocking=false;
    }
);


blockButton.addEventListener(
    "pointercancel",
    ()=>{
        blocking=false;
    }
);


// =====================================================
// JOYSTICK
// =====================================================

const joystick =
document.getElementById(
    "joystick"
);


const stick =
document.getElementById(
    "stick"
);


function moveJoystick(e){

    const rect =
        joystick.getBoundingClientRect();


    let x =
        e.clientX -
        (
            rect.left+
            rect.width/2
        );


    let y =
        e.clientY -
        (
            rect.top+
            rect.height/2
        );


    const max=45;


    const distance =
        Math.sqrt(
            x*x+y*y
        );


    if(distance>max){

        x =
            x/distance*max;

        y =
            y/distance*max;

    }


    stick.style.left =
        (38+x)+"px";


    stick.style.top =
        (38+y)+"px";


    joystickX=x/max;

    joystickY=y/max;

}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickPointer=
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(e);

    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId===
            joystickPointer
        ){

            moveJoystick(e);

        }

    }
);


function resetJoystick(){

    joystickX=0;

    joystickY=0;

    stick.style.left="38px";

    stick.style.top="38px";

    joystickPointer=null;

}


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


// =====================================================
// GEGNER-KI
// =====================================================

function enemyAI(delta){

    if(gameOver)return;


    const distance =
        enemy.position.distanceTo(
            player.position
        );


    // Gegner läuft schneller je höher die Runde

    if(distance>2.5){

        const direction =
            new THREE.Vector3()
            .subVectors(
                player.position,
                enemy.position
            )
            .normalize();


        enemy.position.x +=
            direction.x*
            enemySpeed*
            delta;


        enemy.position.z +=
            direction.z*
            enemySpeed*
            delta;

    }


    enemyAttackTimer-=delta;


    if(
        distance<2.7 &&
        enemyAttackTimer<=0
    ){

        enemyAttackTimer =
            enemyAttackCooldown;


        let damage =
            enemyDamage;


        // Block reduziert Schaden

        if(blocking){

            damage*=.25;

        }


        playerHP-=damage;

        updateHP();

    }

}


// =====================================================
// ANIMATION
// =====================================================

function animatePlayer(){

    const left =
        player.userData.leftArm;

    const right =
        player.userData.rightArm;


    if(playerAttack>0){

        right.rotation.x=-1.2;

    }else{

        right.rotation.x=0;

    }


    if(blocking){

        left.rotation.x=-1.2;

        right.rotation.x=-1.2;

    }
    else if(playerAttack<=0){

        left.rotation.x=0;

    }

}


// =====================================================
// RUNDE GEWONNEN
// =====================================================

function winRound(){

    gameOver=true;


    document.getElementById(
        "messageTitle"
    ).textContent =
        "SIEG!";


    document.getElementById(
        "messageText"
    ).textContent =
        "Runde "+round+
        " gewonnen! Der nächste Roboter wird stärker.";


    document.getElementById(
        "message"
    ).style.display="flex";

}


// =====================================================
// SPIEL VERLOREN
// =====================================================

function loseGame(){

    gameOver=true;


    document.getElementById(
        "messageTitle"
    ).textContent =
        "VERLOREN";


    document.getElementById(
        "messageText"
    ).textContent =
        "Du bist bis Runde "+
        round+
        " gekommen.";


    document.getElementById(
        "nextRound"
    ).textContent =
        "NOCHMAL";


    document.getElementById(
        "message"
    ).style.display="flex";

}


// =====================================================
// NÄCHSTE RUNDE
// =====================================================

document.getElementById(
    "nextRound"
).addEventListener(
    "click",
    ()=>{

        const button =
            document.getElementById(
                "nextRound"
            );


        // Wenn Spieler verloren hat:
        if(playerHP<=0){

            round=1;

            button.textContent=
                "NÄCHSTE RUNDE";

        }

        else{

            round++;

        }


        document.getElementById(
            "message"
        ).style.display="none";


        gameOver=false;


        createNextEnemy();

    }
);


// =====================================================
// KAMERA
// =====================================================

function updateCamera(){

    const middle =
        new THREE.Vector3()
        .addVectors(
            player.position,
            enemy.position
        )
        .multiplyScalar(.5);


    camera.position.x =
        THREE.MathUtils.lerp(
            camera.position.x,
            middle.x,
            .05
        );


    camera.position.z =
        THREE.MathUtils.lerp(
            camera.position.z,
            middle.z+10,
            .05
        );


    camera.lookAt(
        middle.x,
        2,
        middle.z
    );

}


// =====================================================
// SPIEL-CHECK
// =====================================================

function checkGame(){

    if(
        enemyHP<=0 &&
        !gameOver
    ){

        winRound();

    }


    if(
        playerHP<=0 &&
        !gameOver
    ){

        loseGame();

    }

}


// =====================================================
// GAME LOOP
// =====================================================

let last=
    performance.now();


function gameLoop(){

    requestAnimationFrame(
        gameLoop
    );


    const now=
        performance.now();


    let delta=
        (now-last)/1000;


    last=now;


    delta=
        Math.min(
            delta,
            .05
        );


    if(playerAttack>0){

        playerAttack-=delta;

    }


    movePlayer(delta);

    enemyAI(delta);

    animatePlayer();

    checkGame();

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


updateHP();

gameLoop();


// =====================================================
// iPAD RESIZE
// =====================================================

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
